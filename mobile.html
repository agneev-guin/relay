<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Vehicle Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0d0d1a; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

  /* ── Color picker splash ── */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(160deg, #0d0d1a 0%, #12122a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 32px;
  }
  #splash.hidden { display: none; }
  .splash-title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; line-height: 1.3; }
  .splash-sub   { font-size: 13px; color: #888; text-align: center; }
  .vtype-badge  {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    text-transform: uppercase;
  }
  .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 280px; }
  .color-btn {
    aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; transition: transform 0.15s, border-color 0.15s;
    position: relative;
  }
  .color-btn:active { transform: scale(0.92); }
  .color-btn.selected { border-color: #fff; transform: scale(1.08); }
  .color-btn::after {
    content: '✓'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; opacity: 0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .color-btn.selected::after { opacity: 1; }
  .go-btn {
    width: 100%; max-width: 280px; padding: 14px;
    border-radius: 12px; border: none; cursor: pointer;
    font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
    background: #2ecc71; color: #fff;
    transition: opacity 0.2s;
  }
  .go-btn:disabled { opacity: 0.35; cursor: default; }

  /* ── Map ── */
  #map { position: fixed; inset: 0; z-index: 0; }

  /* ── Bottom info bar ── */
  #info-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
    background: rgba(10, 10, 25, 0.88); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px 16px 14px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  #color-swatch {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.5);
  }
  #vtype-label { font-weight: 600; text-transform: uppercase; font-size: 11px; color: #aaa; }
  #speed-val { font-weight: 700; font-size: 15px; color: #fff; }
  .badge {
    padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  #rerouted-badge { background: #FF6B35; color: #fff; display: none; }
  #rerouted-badge.show { display: inline-block; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0;
    margin-left: auto;
  }
  #status-dot.connected { background: #2ecc71; }
  #status-dot.error     { background: #e74c3c; }

  /* —— Stacked info bars above the bottom info-bar —— */
  #extras {
    position: fixed; left: 0; right: 0; bottom: 58px; z-index: 510;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  .ex-bar {
    display: none; align-items: center; gap: 9px;
    padding: 8px 16px; font-size: 12.5px; line-height: 1.25;
    background: rgba(10,10,25,0.9); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.08);
    pointer-events: auto;
  }
  .ex-bar.show { display: flex; }
  .ex-ico { font-size: 15px; flex-shrink: 0; }
  .ex-txt { flex: 1; min-width: 0; color: #e8e8e8; }
  .ex-txt b { color: #fff; }
  .ex-sub { color: #9a9aa8; font-size: 11px; }
  #cong-bar { border-left: 3px solid #f1c40f; }
  #ev-bar { border-left: 3px solid #2ecc71; }
  .ev-batt {
    position: relative; width: 28px; height: 14px; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.75); border-radius: 3px;
  }
  .ev-batt::after {
    content: ''; position: absolute; right: -4px; top: 3.5px;
    width: 2.5px; height: 5px; background: rgba(255,255,255,0.75);
    border-radius: 0 1px 1px 0;
  }
  #ev-fill {
    position: absolute; top: 1px; left: 1px; bottom: 1px; width: 0%;
    border-radius: 1.5px; background: #2ecc71;
    transition: width 0.4s ease, background 0.4s ease;
  }
  #ev-soc { font-weight: 700; color: #fff; font-size: 12.5px; flex-shrink: 0; min-width: 34px; }

  /* —— Name badge —— */
  #name-bar {
    display: none; align-items: center; justify-content: center;
    gap: 8px; padding: 6px 16px; font-size: 13px;
    background: rgba(10,10,25,0.82); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.08);
    pointer-events: auto;
  }
  #name-bar.show { display: flex; }
  #name-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
  #name-label { font-weight: 700; color: #fff; font-size: 14px; letter-spacing: 0.3px; }
  #name-sub   { font-size: 11px; color: #888; text-transform: uppercase; }

  /* —— Person name-confirm sheet —— */
  #name-sheet {
    position: fixed; bottom: -260px; left: 0; right: 0; z-index: 900;
    background: rgba(14,14,30,0.97); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.12); border-radius: 20px 20px 0 0;
    padding: 22px 24px 36px;
    transition: bottom 0.3s cubic-bezier(0.25,0.8,0.25,1);
  }
  #name-sheet.open { bottom: 0; }
  #name-sheet .ns-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  #name-sheet .ns-sub   { font-size: 12px; color: #888; margin-bottom: 16px; }
  #name-input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 15px; outline: none; margin-bottom: 14px;
    -webkit-appearance: none;
  }
  #name-input:focus { border-color: rgba(124,131,253,0.7); }
  #name-sheet .ns-btns { display: flex; gap: 10px; }
  .btn-name-ok {
    flex: 1; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 700; color: #fff;
    transition: opacity 0.15s;
  }
  .btn-name-ok:active { opacity: 0.7; }
  .btn-name-keep {
    padding: 13px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); cursor: pointer;
    font-size: 14px; font-weight: 600; color: #ccc;
  }
  /* ── Place accident hint ── */
  #place-hint {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 500; background: rgba(10,10,25,0.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
    padding: 8px 18px; font-size: 12px; color: #aaa; white-space: nowrap;
    pointer-events: none;
  }

  /* ── Confirmation bottom sheet ── */
  #confirm-sheet {
    position: fixed; bottom: -200px; left: 0; right: 0; z-index: 800;
    background: rgba(14,14,30,0.96); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.12); border-radius: 20px 20px 0 0;
    padding: 20px 24px 32px;
    transition: bottom 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  #confirm-sheet.open { bottom: 0; }
  .sheet-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .sheet-sub   { font-size: 12px; color: #888; margin-bottom: 20px; }
  .sheet-btns  { display: flex; gap: 12px; }
  .btn-confirm {
    flex: 1; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 700; color: #fff;
    transition: opacity 0.15s;
  }
  .btn-confirm:active { opacity: 0.7; }
  .btn-cancel  {
    flex: 1; padding: 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); cursor: pointer;
    font-size: 15px; font-weight: 600; color: #ccc;
  }

  /* ── "Accident live" pulse indicator ── */
  #acc-indicator {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    z-index: 500; display: none; align-items: center; gap: 8px;
    background: rgba(10,10,25,0.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
    padding: 7px 16px; font-size: 12px; color: #fff; white-space: nowrap;
  }
  #acc-indicator.show { display: flex; }
  #acc-pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    animation: acc-dot-pulse 1s ease-in-out infinite;
  }
  @keyframes acc-dot-pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.6); opacity: 0.5; }
  }

  /* ── Leaflet pin marker ── */
  .pin-marker {
    width: 20px; height: 20px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); border: 2px solid #fff;
  }

  /* ── Vehicle marker ── */
  .mob-vehicle {
    border-radius: 50%; border: 2px solid rgba(255,255,255,0.9);
  }
</style>
</head>
<body>

<!-- Color picker splash -->
<div id="splash">
  <div class="splash-title">Choose your color<br>to follow a live vehicle</div>
  <div class="splash-sub">Vehicle type: <span class="vtype-badge" id="vtype-splash">__VEHICLE_TYPE__</span></div>
  <div class="color-grid" id="color-grid"></div>
  <button class="go-btn" id="go-btn" disabled>Connect &rarr;</button>
</div>

<!-- Stacked info bars (congestion + EV + name) above the bottom info-bar -->
<div id="extras">
  <!-- Congestion near you -->
  <div id="cong-bar" class="ex-bar">
    <span class="ex-ico" id="cong-ico">⚠️</span>
    <span class="ex-txt" id="cong-txt"></span>
  </div>
  <!-- EV battery / charging -->
  <div id="ev-bar" class="ex-bar">
    <span class="ex-ico">⚡</span>
    <span class="ev-batt"><span id="ev-fill"></span></span>
    <span id="ev-soc">—</span>
    <span class="ex-txt" id="ev-txt"></span>
  </div>
  <!-- Name bar — shown once server sends init with name -->
  <div id="name-bar">
    <div id="name-dot"></div>
    <span id="name-label"></span>
    <span id="name-sub"></span>
  </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Top hints -->
<div id="place-hint">Tap anywhere on the map to place an accident</div>
<div id="acc-indicator">
  <div id="acc-pulse-dot"></div>
  <span id="acc-indicator-text">Your accident is live</span>
</div>

<!-- Bottom info bar -->
<div id="info-bar">
  <div id="color-swatch"></div>
  <div>
    <div id="vtype-label">__VEHICLE_TYPE__</div>
    <div id="speed-val">— km/h</div>
  </div>
  <span class="badge" id="rerouted-badge">⇄ Rerouted</span>
  <div id="status-dot"></div>
</div>

<!-- Confirmation sheet -->
<div id="confirm-sheet">
  <div class="sheet-title">Place accident here?</div>
  <div class="sheet-sub" id="sheet-coords"></div>
  <div class="sheet-btns">
    <button class="btn-confirm" id="btn-confirm">Confirm</button>
    <button class="btn-cancel"  id="btn-cancel">Cancel</button>
  </div>
</div>

<!-- Person name-confirm sheet (only used for person type) -->
<div id="name-sheet">
  <div class="ns-title">Your vehicle name</div>
  <div class="ns-sub" id="name-sheet-sub">You have been assigned this name. Keep it or enter your own.</div>
  <input id="name-input" type="text" maxlength="80" placeholder="Enter your name">
  <div class="ns-btns">
    <button class="btn-name-ok" id="btn-name-ok">Use this name</button>
    <button class="btn-name-keep" id="btn-name-keep">Keep assigned</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  "use strict";

  const VTYPE   = "__VEHICLE_TYPE__";
  const SWATCHES = [
    { color: "#e74c3c", label: "Red"    },
    { color: "#f39c12", label: "Orange" },
    { color: "#2ecc71", label: "Green"  },
    { color: "#00bcd4", label: "Cyan"   },
    { color: "#9b59b6", label: "Purple" },
    { color: "#ff69b4", label: "Pink"   },
  ];

  // ── Color picker ──────────────────────────────────────────────────
  let selectedColor = null;
  const grid   = document.getElementById("color-grid");
  const goBtn  = document.getElementById("go-btn");
  const splash = document.getElementById("splash");

  SWATCHES.forEach(function (s) {
    const btn = document.createElement("button");
    btn.className = "color-btn";
    btn.style.background = s.color;
    btn.setAttribute("aria-label", s.label);
    btn.addEventListener("click", function () {
      document.querySelectorAll(".color-btn").forEach(function (b) { b.classList.remove("selected"); });
      btn.classList.add("selected");
      selectedColor = s.color;
      goBtn.disabled = false;
      goBtn.style.background = s.color;
    });
    grid.appendChild(btn);
  });

  goBtn.addEventListener("click", function () {
    if (!selectedColor) return;
    splash.classList.add("hidden");
    initMap(selectedColor);
  });

  // ── Map + WebSocket ───────────────────────────────────────────────
  function initMap(color) {
    document.getElementById("color-swatch").style.background = color;
    document.getElementById("btn-confirm").style.background  = color;
    document.getElementById("acc-pulse-dot").style.background = color;

    const map = L.map("map", { zoomControl: true, preferCanvas: true, tap: true })
      .setView([12.9716, 77.5946], 14);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "(c) OSM, (c) CartoDB", maxZoom: 19
    }).addTo(map);

    // Layers
    const accidentLayer = L.layerGroup().addTo(map);
    const accidentZones = L.layerGroup().addTo(map);
    const routeLayer    = L.layerGroup().addTo(map);
    let vehicleMarker   = null;
    let lastLat = null, lastLon = null;

    // ── Route lines: original planned path + active reroute for THIS vehicle ──
    function drawRoute(route) {
      routeLayer.clearLayers();
      if (!route) return;
      if (route.original && route.original.length > 1) {
        L.polyline(route.original, {
          color: "#5b8def", weight: 3, opacity: 0.55, lineJoin: "round"
        }).addTo(routeLayer);
      }
      if (route.reroute && route.reroute.length > 1) {
        L.polyline(route.reroute, {
          color: "#ff8c00", weight: 4, opacity: 0.95, dashArray: "8,6", lineJoin: "round"
        }).addTo(routeLayer);
      }
    }

    // ── Status dot ──
    const statusDot = document.getElementById("status-dot");
    function setStatus(s) {
      statusDot.className = s === "ok" ? "connected" : s === "error" ? "error" : "";
    }

    // ── Accident markers ──
    const knownAccidents = {}; // "lat,lon" -> {marker, zone}

    function addAccident(lat, lon, radius_m, acColor) {
      const key = parseFloat(lat).toFixed(5) + "," + parseFloat(lon).toFixed(5);
      if (knownAccidents[key]) return;
      const c = (acColor && /^#[0-9a-f]{6}$/i.test(acColor)) ? acColor : "#ff0044";
      const fillRgba = "rgba(" + parseInt(c.slice(1,3),16) + "," + parseInt(c.slice(3,5),16) + "," + parseInt(c.slice(5,7),16) + ",0.22)";
      const svgSize = 36;
      const svgHtml =
        '<svg width="' + svgSize + '" height="' + svgSize + '" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">' +
          '<polygon points="18,3 33,31 3,31" fill="' + fillRgba + '" stroke="' + c + '" stroke-width="2.5" stroke-linejoin="round"/>' +
          '<text x="18" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="' + c + '" font-family="sans-serif">!</text>' +
        '</svg>';
      const icon = L.divIcon({ html: svgHtml, className: "", iconSize: [svgSize, svgSize], iconAnchor: [svgSize/2, svgSize/2] });
      const m = L.marker([lat, lon], { icon: icon }).addTo(accidentLayer);
      const z = L.circle([lat, lon], {
        radius: radius_m || 450, color: c, weight: 1.5,
        dashArray: "8,6", opacity: 0.55, fillColor: c, fillOpacity: 0.06
      }).addTo(accidentZones);
      knownAccidents[key] = { marker: m, zone: z };
    }

    function removeAccidentByKey(key) {
      const entry = knownAccidents[key];
      if (entry) {
        accidentLayer.removeLayer(entry.marker);
        accidentZones.removeLayer(entry.zone);
        delete knownAccidents[key];
      }
    }

    function syncAccidents(accList) {
      // Build the authoritative key set from server
      const newKeys = new Set();
      accList.forEach(function(a) {
        const key = parseFloat(a.lat).toFixed(5) + "," + parseFloat(a.lon).toFixed(5);
        newKeys.add(key);
        if (!knownAccidents[key]) addAccident(a.lat, a.lon, a.radius_m, a.color);
      });
      // Remove accidents no longer on the server
      Object.keys(knownAccidents).forEach(function(key) {
        if (!newKeys.has(key)) removeAccidentByKey(key);
      });
    }

    function clearAccidents() {
      Object.keys(knownAccidents).forEach(removeAccidentByKey);
    }

    // ── Vehicle marker ──
    function makeVehicleIcon(sz, col) {
      const html = '<div class="mob-vehicle" style="width:' + sz + 'px;height:' + sz + 'px;background:' + col + ';box-shadow:0 0 10px ' + col + '"></div>';
      return L.divIcon({ html: html, className: "", iconSize: [sz, sz], iconAnchor: [sz/2, sz/2] });
    }

    // Client-side interpolation state
    var _animFrame = null;

    function updateVehicle(lat, lon, speed, heading, rerouted) {
      const speedEl = document.getElementById("speed-val");
      const rerEl   = document.getElementById("rerouted-badge");
      speedEl.textContent = (speed !== undefined ? speed.toFixed(1) : "—") + " km/h";
      rerEl.classList.toggle("show", !!rerouted);

      if (lastLat === null) {
        // First fix — place marker immediately, no animation needed
        if (!vehicleMarker) {
          vehicleMarker = L.marker([lat, lon], { icon: makeVehicleIcon(18, color), zIndexOffset: 500 }).addTo(map);
        } else {
          vehicleMarker.setLatLng([lat, lon]);
        }
        map.setView([lat, lon], 15);
        lastLat = lat; lastLon = lon;
        return;
      }

      // Smoothly animate the marker between previous and new position
      // using requestAnimationFrame so movement is fluid at ~60 fps instead
      // of jumping once per server frame (100 ms).
      var fromLat = lastLat, fromLon = lastLon;
      var startTs = performance.now();
      var dur = 110; // ms — slightly longer than server frame interval so frames overlap
      if (_animFrame) { cancelAnimationFrame(_animFrame); _animFrame = null; }
      function _step(ts) {
        var p = Math.min(1.0, (ts - startTs) / dur);
        // Ease-out: decelerate towards the target for a natural feel
        var pe = 1 - (1 - p) * (1 - p);
        var iLat = fromLat + (lat - fromLat) * pe;
        var iLon = fromLon + (lon - fromLon) * pe;
        if (!vehicleMarker) {
          vehicleMarker = L.marker([iLat, iLon], { icon: makeVehicleIcon(18, color), zIndexOffset: 500 }).addTo(map);
        } else {
          vehicleMarker.setLatLng([iLat, iLon]);
        }
        if (p < 1.0) {
          _animFrame = requestAnimationFrame(_step);
        } else {
          _animFrame = null;
        }
      }
      _animFrame = requestAnimationFrame(_step);

      // Follow the vehicle — short snappy pan so the map keeps up
      map.panTo([lat, lon], { animate: true, duration: 0.15 });
      lastLat = lat; lastLon = lon;
    }

    // ── Congestion-near-you + EV battery bars ──
    const SEV_COLORS = { moderate: "#f1c40f", heavy: "#e67e22", severe: "#e74c3c" };
    function renderCongestion(c) {
      const bar = document.getElementById("cong-bar");
      if (!c || !c.area) { bar.classList.remove("show"); return; }
      const col = SEV_COLORS[c.severity] || "#f1c40f";
      const dist = (c.distance_m == null) ? "" :
        (c.distance_m < 1000 ? Math.round(c.distance_m) + " m"
                             : (c.distance_m / 1000).toFixed(1) + " km");
      const spd = (c.avg_kmh != null) ? (" \u00b7 " + c.avg_kmh + " km/h") : "";
      const sev = (c.severity || "").charAt(0).toUpperCase() + (c.severity || "").slice(1);
      bar.style.borderLeftColor = col;
      document.getElementById("cong-ico").textContent =
        (c.severity === "severe") ? "\uD83D\uDED1" : "\u26A0\uFE0F";
      document.getElementById("cong-txt").innerHTML =
        "<b>" + sev + " congestion</b> in " + c.area +
        "<span class='ex-sub'> \u00b7 " + dist + " " + (c.direction || "") + spd + "</span>";
      bar.classList.add("show");
    }

    const EV_COLORS = { ok: "#2ecc71", low: "#f1c40f", critical: "#e74c3c" };
    function renderEv(ev) {
      const bar = document.getElementById("ev-bar");
      if (!ev || !ev.is_ev) { bar.classList.remove("show"); return; }
      const col = EV_COLORS[ev.status] || "#2ecc71";
      const fill = document.getElementById("ev-fill");
      fill.style.width = Math.max(0, Math.min(100, ev.soc_pct)) + "%";
      fill.style.background = col;
      const socEl = document.getElementById("ev-soc");
      socEl.textContent = ev.soc_pct + "%";
      socEl.style.color = col;
      bar.style.borderLeftColor = col;
      let txt = "Range <b>" + ev.range_km + " km</b>";
      if (ev.charge_to_80_min > 0) {
        txt += "<span class='ex-sub'> \u00b7 +" + ev.charge_to_80_kwh +
               " kWh, ~" + ev.charge_to_80_min + " min to 80%</span>";
      }
      txt += "<br><span class='ex-sub'>" + (ev.recommendation || "") + "</span>";
      document.getElementById("ev-txt").innerHTML = txt;
      bar.classList.add("show");
    }

    // ── Pin marker for accident placement ──
    let pendingPin = null;
    let pendingLatLon = null;

    function dropPin(latlng) {
      if (pendingPin) { map.removeLayer(pendingPin); }
      const pinHtml = '<div class="pin-marker" style="background:' + color + '"></div>';
      pendingPin = L.marker(latlng, {
        icon: L.divIcon({ html: pinHtml, className: "", iconSize: [20,20], iconAnchor: [10,20] }),
        zIndexOffset: 900
      }).addTo(map);
      pendingLatLon = latlng;
      document.getElementById("sheet-coords").textContent =
        latlng.lat.toFixed(4) + ", " + latlng.lng.toFixed(4);
      document.getElementById("confirm-sheet").classList.add("open");
    }

    map.on("click", function (e) {
      // Don't trigger if the sheet is already open
      if (document.getElementById("confirm-sheet").classList.contains("open")) return;
      dropPin(e.latlng);
    });

    document.getElementById("btn-cancel").addEventListener("click", function () {
      document.getElementById("confirm-sheet").classList.remove("open");
      if (pendingPin) { map.removeLayer(pendingPin); pendingPin = null; }
    });

    // ── Name-confirm sheet buttons (person type) ──
    function _applyName(name) {
      document.getElementById("name-sheet").classList.remove("open");
      document.getElementById("name-label").textContent = name;
      document.getElementById("name-bar").classList.add("show");
    }
    document.getElementById("btn-name-keep").addEventListener("click", function () {
      _applyName(document.getElementById("name-label").textContent);
    });
    document.getElementById("btn-name-ok").addEventListener("click", function () {
      const inp = document.getElementById("name-input").value.trim();
      if (inp) {
        document.getElementById("name-label").textContent = inp;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: "set_name", name: inp }));
        }
        _applyName(inp);
      } else {
        _applyName(document.getElementById("name-label").textContent);
      }
    });

    document.getElementById("btn-confirm").addEventListener("click", function () {
      document.getElementById("confirm-sheet").classList.remove("open");
      if (pendingPin) { map.removeLayer(pendingPin); pendingPin = null; }
      if (pendingLatLon) {
        // Optimistic: show the accident marker immediately without waiting for
        // the relay round-trip. The server echo (accident_created) will be a
        // no-op because addAccident() guards against duplicate keys.
        addAccident(pendingLatLon.lat, pendingLatLon.lng, 300, color);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            action:   "create_accident",
            lat:      pendingLatLon.lat,
            lon:      pendingLatLon.lng,
            radius_m: 300,
            severity: "medium",
          }));
        }
        // Show "rerouting in progress" indicator until accident_update arrives
        const ind = document.getElementById("acc-indicator");
        ind.classList.add("show");
        document.getElementById("acc-indicator-text").textContent = "Accident placed — rerouting…";
        document.getElementById("acc-pulse-dot").style.background = color;
        setTimeout(function () { ind.classList.remove("show"); }, 12000);
      }
      pendingLatLon = null;
    });

    // ── WebSocket ──
    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const url   = proto + "//" + location.host + "/ws/mobile/" + encodeURIComponent(VTYPE) +
                    "?color=" + encodeURIComponent(color);
      ws = new WebSocket(url);

      ws.onopen = function () {
        setStatus("ok");
        if (ws._heartbeatTimer) clearInterval(ws._heartbeatTimer);
        ws._heartbeatTimer = setInterval(function () {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: "heartbeat" }));
          }
        }, 30000);
      };
      ws.onclose = function () {
        setStatus("error");
        if (ws._heartbeatTimer) { clearInterval(ws._heartbeatTimer); ws._heartbeatTimer = null; }
        setTimeout(connect, 2000);
      };
      ws.onerror = function () { setStatus("error"); };

      ws.onmessage = function (e) {
        let msg;
        try { msg = JSON.parse(e.data); } catch (_) { return; }
        handle(msg);
      };
    }

    function handle(msg) {
      if (msg.type === "init") {
        setStatus("ok");
        if (msg.accidents) syncAccidents(msg.accidents);
        if (msg.name) {
          document.getElementById("name-label").textContent = msg.name;
          document.getElementById("name-sub").textContent =
            VTYPE === "ev" ? "electric vehicle" : VTYPE.replace(/_/g," ");
          const dot = document.getElementById("name-dot");
          dot.style.background = color; dot.style.boxShadow = "0 0 6px " + color;
          // For persons: show name-confirm sheet first
          if (VTYPE === "person") {
            const inp = document.getElementById("name-input");
            inp.value = msg.name;
            inp.style.borderColor = color;
            document.getElementById("btn-name-ok").style.background = color;
            document.getElementById("name-sheet-sub").textContent =
              '\u201c' + msg.name + '\u201d is your assigned name. Keep it or enter your own below.';
            document.getElementById("name-sheet").classList.add("open");
          } else {
            document.getElementById("name-bar").classList.add("show");
          }
        }
      } else if (msg.type === "update") {
        if (VTYPE === "ev" && msg.real_vtype) {
          const rt = msg.real_vtype.replace(/_/g," ");
          document.getElementById("vtype-label").textContent = "EV \u00b7 " + rt;
          document.getElementById("name-sub").textContent = rt + " \u00b7 electric";
        }
        if (msg.lat !== undefined && msg.lon !== undefined) {
          updateVehicle(msg.lat, msg.lon, msg.speed, msg.heading, msg.rerouted);
        }
        if (msg.route) drawRoute(msg.route);
        if (msg.accidents) syncAccidents(msg.accidents);
        renderCongestion(msg.congestion);
        renderEv(msg.ev);
      } else if (msg.type === "vehicle_switched") {
        // New vehicle assigned — reset last position so map re-centers
        lastLat = null; lastLon = null;
        if (vehicleMarker) { map.removeLayer(vehicleMarker); vehicleMarker = null; }
        routeLayer.clearLayers();
        document.getElementById("cong-bar").classList.remove("show");
        document.getElementById("ev-bar").classList.remove("show");
        // Update the displayed model to match the new vehicle (keeps the shown
        // model consistent with its EV status).
        if (msg.name && VTYPE !== "person") {
          document.getElementById("name-label").textContent = msg.name;
          document.getElementById("name-bar").classList.add("show");
        }
      } else if (msg.type === "accident_created") {
        addAccident(msg.lat, msg.lon, 300, msg.color);
      } else if (msg.type === "accident_update") {
        // Final rerouted count arrives after background work completes
        const n = msg.rerouted_vehicles || 0;
        const ind2 = document.getElementById("acc-indicator");
        document.getElementById("acc-indicator-text").textContent =
          n > 0 ? n + " vehicles rerouted" : "Accident live (no reroutes)";
        document.getElementById("acc-pulse-dot").style.background = color;
        ind2.classList.add("show");
        setTimeout(function () { ind2.classList.remove("show"); }, 5000);
      } else if (msg.type === "accident_removed") {
        // Server sends remaining list — use it to reconcile rather than blind clear
        const rem = (msg.remaining && Array.isArray(msg.remaining)) ? msg.remaining : [];
        syncAccidents(rem);
      } else if (msg.type === "accidents_cleared") {
        clearAccidents();
      } else if (msg.type === "error") {
        const ind = document.getElementById("acc-indicator");
        ind.classList.add("show");
        document.getElementById("acc-indicator-text").textContent = msg.message || "Error";
        document.getElementById("acc-pulse-dot").style.background = "#e74c3c";
        setTimeout(function () {
          ind.classList.remove("show");
          document.getElementById("acc-pulse-dot").style.background = color;
        }, 4000);
      }
    }

    connect();
  }
})();
</script>
</body>
</html>
